<!DOCTYPE html>
<html>
<head><title>Admin Panel</title></head>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"<!-- cover, auto, contain -->
<body>
    <div class="body">
    <h1>🛡️ Admin Panel</h1>
    <p>Welcome, <strong>{{ user }}</strong>.</p>

    <hr style="width: 300px;">

    <h3>Signed-Up Users</h3>
    {% for u in user_list %}
        <p>{{ u }}</p>
    {% endfor %}    
    <hr style="width: 300px;">

    <h3>System Settings</h3>
    <p>Current Admin Username: <code>{{ admin_user }}</code></p>
    <p><em>(To change the username or password, edit the top of <code>app.py</code>)</em></p>

    <br><br>
    <p>
        <a style="color: white; background-color: black;" href="{{ url_for('welcome') }}">⬅️ Back to Welcome</a> |
        <a style="color: white; background-color: black;" href="{{ url_for('logout') }}">🚪 Logout</a>
    </p>
    </div>
</body>
</html>
