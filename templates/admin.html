<!DOCTYPE html>
<html>
<head><title>Admin Panel</title></head>
<!-- cover, auto, contain -->
<body style="font-family: monospace, sans-serif;
             background-image: url('/static/cat.png');
             background-color: black;
             background-size: auto; 
             background-attachment: fixed;
             text-align: center;
             color: white;
             margin-top: 80px;">
    <h1>🛡️ Admin Panel</h1>
    <p>Welcome to the control room, <strong>{{ user }}</strong>.</p>
    
    <hr style="width: 300px;">
    
    <h3>System Status</h3>
    <p>TensorFlow Model: <strong>{{ model_status }}</strong></p>
    <p>Camera Stream: <a href="{{ url_for('webcam') }}">Go to Webcam Page</a></p>

    <hr style="width: 300px;">

    <h3>System Settings</h3>
    <p>Current Admin Username: <code>{{ admin_user }}</code></p>
    <p><em>(To change the username or password, edit the top of <code>app.py</code>)</em></p>

    <br><br>
    <p>
        <a href="{{ url_for('welcome') }}">⬅️ Back to Welcome</a> | 
        <a href="{{ url_for('logout') }}">🚪 Logout</a>
    </p>
</body>
</html>
