<!DOCTYPE html>
<html>
<head><title>Webcam</title></head>

<body style="font-family: monospace, sans-serif;
             background-image: url('/static/cat.png');
             background-color: black;
             background-size: auto;
             background-attachment: fixed;
             text-align: center;
             color: white;
             margin-top: 80px;">

    <h1>📷 Webcam Classifier</h1>

    <p>
        <!-- Navigation links to other views via url_for. -->
        <a href="{{ url_for('welcome') }}">🏠 Back</a> |
        <a href="{{ url_for('logout') }}">🚪 Logout</a>
    </p>

    <!-- Placeholder text: real model output is injected by JavaScript. -->
    <div>Teachable Machine Image Model</div>

    <!--
        onclick="init()" calls the JS function `init` (defined in the
        <script> block below) when the button is clicked.
        Inline styles give it a black background with white text.
    -->
    <button style="color: white; background-color: black;" onclick="init()">Start</button>

    <!--
        Empty container divs. JavaScript will:
          - append the <canvas> element to #webcam-container
          - append prediction <div>s to #label-container
        An `id` lets JS find them with document.getElementById(...).
    -->
    <div id="webcam-container"></div>
    <div style="font-size: 20px;" id="label-container"></div>

    <!--
        <script src="..."> loads external JS libraries:
          - TensorFlow.js (tf.min.js)
          - Teachable Machine Image library (teachablemachine-image.min.js)
        These expose the global objects `tf` and `tmImage` used by the
        inline script that follows.
    -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <!--
        <script type="text/javascript"> contains the inline model-loading
        and webcam-prediction logic. (JavaScript intentionally NOT explained
        per the request.)
    -->
    <script type="text/javascript">
        /* ... JavaScript omitted as requested ... */
    </script>
</body>
</html>
