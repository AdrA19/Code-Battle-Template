<!DOCTYPE html>
<html>
<head><title>Login</title></head>

<body style="font-family: monospace, sans-serif;
             background-image: url('/static/cat.png');
             background-color: black;
             background-size: auto;
             background-attachment: fixed;
             text-align: center;
             color: white;
             margin-top: 80px;">

    <!--
        Jinja2 if/else on one line:
          {% if mode == 'signup' %} ... {% else %} ... {% endif %}
        The heading text changes based on the `mode` variable.
    -->
    <h1>{% if mode == 'signup' %}📝 Sign Up{% else %}🔐 Login{% endif %}</h1>

    <!--
        Only render the error <p> if `error` is truthy (not None/empty).
        Style "color: red" makes error messages stand out.
    -->
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}

    <!--
        <form method="POST" ...> submits a POST request.
        The `action` attribute is set dynamically:
          - in signup mode -> url_for('signup')
          - in login mode  -> url_for('login')
        This means the same form file works for both pages.
    -->
    <form method="POST" action="{% if mode == 'signup' %}{{ url_for('signup') }}{% else %}{{ url_for('login') }}{% endif %}">

        <!--
            <input name="username"> creates a text field.
            The `name` attribute is the key Flask reads via request.form["username"].
            `placeholder` shows grey hint text.
            `required` makes the browser enforce non-empty input (HTML5 validation).
        -->
        <p><input name="username" placeholder="Username" required></p>

        <!-- type="password" masks characters; name="password" is the form key. -->
        <p><input name="password" type="password" placeholder="Password" required></p>

        <!-- Submit button. Its label also switches with `mode`. -->
        <button style="padding: 5px 15px;">{% if mode == 'signup' %}Sign Up{% else %}Login{% endif %}</button>
    </form>

    <p>
        <!--
            Toggle link: from signup -> back to login, and vice versa.
            A <button> nested in an <a> isn't strictly valid HTML but works
            in most browsers; cleaner is to style the <a> itself.
        -->
        {% if mode == 'signup' %}
        <a href="{{ url_for('login') }}"><button style="padding: 5px 15px;">Back to Login</button></a>
        {% else %}
        <a href="{{ url_for('signup') }}"><button style="padding: 5px 15px;">Sign Up</button></a>
        {% endif %}
    </p>
</body>
</html>
