<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<!-- Load the shared stylesheet. This tag is correctly closed here. -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<body>
    <!-- {% if mode == 'signup' %} ... {% else %} ... {% endif %} is a Jinja2
         IF/ELSE block. `mode` is the variable Flask passed in.
         If mode is "signup", show "📝 Sign Up"; otherwise show "🔐 Login". -->
    <h1>{% if mode == 'signup' %}📝 Sign Up{% else %}🔐 Login{% endif %}</h1>

    <!-- {% if error %} is a Jinja2 IF. It is truthy only when `error` is a
         non-empty string. If it's None (no error), nothing is shown.
         When there IS an error, render a red paragraph containing it. -->
    {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}

    <!-- <form> collects input fields. method="POST" sends the data in the HTTP
         body (good for sensitive data like passwords). action="..." is the URL
         the form submits to. The Jinja if/else inside the attribute chooses
         the signup URL or the login URL depending on `mode`. -->
    <form method="POST" action="{% if mode == 'signup' %}{{ url_for('signup') }}{% else %}{{ url_for('login') }}{% endif %}">

        <!-- <input> is a text box.
             name="username"  -> this is the key used by request.form["username"].
             placeholder=...  -> grey hint text shown when the box is empty.
             required         -> the browser refuses to submit if it's empty. -->
        <p><input name="username" placeholder="Username" required></p>

        <!-- Same, but type="password" hides the typed characters as dots. -->
        <p><input name="password" type="password" placeholder="Password" required></p>

        <!-- <button> submits the form when clicked.
             style="..." is inline CSS: padding for size, white text on a black
             background.
             Inside the button, the Jinja if/else shows "Sign Up" or "Login"
             to match the current mode. -->
        <button style="padding: 5px 15px; color: white; background-color: black;">{% if mode == 'signup' %}Sign Up{% else %}Login{% endif %}</button>
    </form>

    <p>
        <!-- This block shows the "switch mode" link.
             If we're on the signup page, offer a link back to login;
             otherwise offer a link to signup. -->
        {% if mode == 'signup' %}
        <!-- <a> wrapped around a <button> creates a clickable button.
             url_for('login') -> "/" (the homepage handles login). -->
        <a href="{{ url_for('login') }}" ><button style="color: white; background-color: black;">Back to Login</button></a>
        {% else %}
        <!-- url_for('signup') -> "/signup". -->
        <a href="{{ url_for('signup') }}"><button style="color: white; background-color: black;">Sign Up</button></a>
        {% endif %}
    </p>
</body>
</html>
