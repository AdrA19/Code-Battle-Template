<!DOCTYPE html>
<html>
<head><title>Welcome</title></head>

<body style="font-family: monospace, sans-serif;
             background-image: url('/static/cat.png');
             background-color: black;
             background-size: auto;
             background-attachment: fixed;
             text-align: center;
             color: white;
             margin-top: 80px;">

    <!-- Greets the logged-in user; `user` comes from render_template(...). -->
    <h1>🎉 Welcome, {{ user }}!</h1>

    <!--
        <iframe> embeds another web page inside this one.
        Attributes:
          src            : URL of the embedded page (Scratch project)
          allowtransparency : lets the iframe background blend (older/non-standard)
          width / height : pixel dimensions
          frameborder    : 0 removes the iframe border (legacy HTML attr)
          scrolling      : "no" disables scrollbars inside the iframe
          allowfullscreen: permits the embedded content to go fullscreen
    -->
    <iframe src="https://scratch.mit.edu/projects/1246229171/embed" allowtransparency="true" width="485" height="402"
          frameborder="0" scrolling="no" allowfullscreen></iframe>
    <br>

    <!--
        url_for('static', filename='scratch.html') builds the URL for a file
        placed in the `static/` folder — Flask serves static assets from there
        at /static/<filename>.
    -->
    <iframe src="{{ url_for('static', filename='scratch.html') }}" allowtransparency="true" width="485" height="402"
          frameborder="0" scrolling="no" allowfullscreen></iframe>
    <br>

    <!-- Same Scratch embed repeated. -->
    <iframe src="https://scratch.mit.edu/projects/1246229171/embed" allowtransparency="true" width="485" height="402"
          frameborder="0" scrolling="no" allowfullscreen></iframe>

    <!--
        Conditional rendering: the admin link only appears for admins.
        `is_admin` was passed from the welcome view.
        Jinja2 if block: {% if is_admin %} ... {% endif %}
    -->
    {% if is_admin %}
        <p><a href="{{ url_for('admin_panel') }}">🛡️ Open Admin Panel</a></p>
    {% endif %}

    <!-- Links available to every logged-in user. -->
    <p><a href="{{ url_for('webcam') }}">📷 Webcam Classifier</a></p>
    <p><a href="{{ url_for('logout') }}">🚪 Logout</a></p>
</body>
</html>
