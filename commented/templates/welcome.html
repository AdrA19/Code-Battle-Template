<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
</head>
<!-- Load the shared stylesheet. -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<body>
    <!-- Show a personalised greeting. `user` was passed from the welcome()
         view function. The emoji is just decorative text. -->
    <h1>🎉 Welcome, {{ user }}!</h1>

    <!-- <br> is a line break. -->
    <br>

    <!-- <iframe> embeds another page inside this one.
         src="..." is the embedded page URL — here it's a file called
         scratch.html inside the /static folder (a Scratch project player).
         allowtransparency="true" lets the page's background show through.
         width / height set the size in pixels.
         frameborder="0" hides the border around the iframe.
         scrolling="no" prevents scrollbars inside the iframe.
         allowfullscreen lets the embedded content go fullscreen. -->
    <iframe src="{{ url_for('static', filename='scratch.html') }}" allowtransparency="true"
    width="485" height="402" frameborder="0" scrolling="no" allowfullscreen></iframe>

    <br>

    <!-- A second identical iframe — presumably to show two projects,
         or the same one twice in the original code. -->
    <iframe src="{{ url_for('static', filename='scratch.html') }}" allowtransparency="true"
    width="485" height="402" frameborder="0" scrolling="no" allowfullscreen></iframe>

    <!-- {% if is_admin %} ... {% endif %} is a Jinja2 IF. `is_admin` was passed
         from the view function. If True, render everything up to {% endif %}.
         So non-admins never see the admin panel link at all. -->
    {% if is_admin %}
        <!-- <a> link to the admin panel route. -->
        <p><a class="blanc" href="{{ url_for('admin_panel') }}">🛡️ Open Admin Panel</a></p>
    {% endif %}

    <!-- Always show the webcam link (all logged-in users can use it). -->
    <p><a class="blanc" href="{{ url_for('webcam') }}">📷 Webcam Classifier</a></p>

    <!-- Always show the logout link. -->
    <p><a class="blanc" href="{{ url_for('logout') }}">🚪 Logout</a></p>
</body>
</html>
